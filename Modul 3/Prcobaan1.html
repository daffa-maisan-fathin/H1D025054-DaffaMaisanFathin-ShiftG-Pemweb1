<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Praktikum Pemrograman Web</title>
</head>
<body>
    <p style="border-style: dotted; background-color: red;">Border Dotted Background red</p>
    <p style="border-style: dashed; background-color: green;">Border Dashed Background Green</p>
    <p style="border-style: solid; background-color: blue;">Border Solid Background Green</p>
    <p style="border-style: dounle; background-color: cyan;">Border Double Background Cyan</p>
    <p style="border-style: groove; background-color: magenta;">Border Groove Background Magenta</p>
    <p style="border-style: ridge; background-color: yellow;">Border Ridge Background Yellow</p>
    <p style="border-style: inset; background-color: orange;">Border Inset Background Green</p>
    <p style="border-style: outset; background-color: pink;">Border Outset Background Pink</p>
</body>
</html>
