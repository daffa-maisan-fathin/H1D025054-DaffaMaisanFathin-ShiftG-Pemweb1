<!DOCTYPE html>
<html>
<head>
    <title>Latihan Form</title>
</head>
<body>

    <form action="" method="POST">
        <table>
            <tr>
                <td>Nama</td>
                <td><input type="text" name="nama" value="Romi"></td>
            </tr> 
            <tr>
                <td>Email</td>
                <td><input type="email" name="email" value="romi@gmail.com"></td>
            </tr>
            <tr>
                <td>Username</td>
                <td><input type="text" name="username" value="romi"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="password" value="1234"></td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td>
                    <select name="jenis_kelamin">
                        <option value="Laki-Laki">Laki-Laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </td>S
            </tr>
            <tr>
                    <td valign="button">Alamat</td>
                <td><textarea name="alamat" rows="6" cols="40">Bogor</textarea></td>
            </tr>
            <tr>
                <td><input type="submit" value="Simpan"></td>
                <td></td>
            </tr>
        </table>
    </form>

</body>
</html>
