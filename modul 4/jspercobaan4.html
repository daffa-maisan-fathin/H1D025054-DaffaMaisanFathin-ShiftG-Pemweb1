<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Praktikum Pemrograman Web</title>
</head>
<body>
    <img id="img1" src="ndelok.jpg" style="width: 100px; height: 100px;"
         onmouseover="ganti_gambar2()" onmouseout="ganti_gambar1()">

    <script>
        function ganti_gambar1() {
            document.getElementById("img1").src = "ndelok.jpg";
        }
        function ganti_gambar2() {
            document.getElementById("img1").src = "ndi delok.jpg";
        }
    </script>
</body>
</html>
