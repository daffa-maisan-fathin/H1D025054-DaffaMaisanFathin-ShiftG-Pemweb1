<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tugas 1 - Konversi Nilai</title>
</head>
<body>
    <h2>Konversi Nilai</h2>
    <label for="nilai">Masukkan nilai:</label>
    <input type="number" id="nilai" min="0" max="100">
    <input type="button" value="Hitung" onClick="hitungGrade()">
    <p id="hasil"></p>

    <script>
        function hitungGrade() {
            const input = document.getElementById("nilai");
            const hasil = document.getElementById("hasil");

            if (input.value === "") {
                alert("Nilai harus diisi!");
                input.focus();
                return;
            }

            const nilai = Number(input.value);

            if (nilai < 0 || nilai > 100) {
                alert("Nilai harus di antara 0 sampai 100!");
                input.focus();
                return;
            }

            let grade;
            if (nilai <= 20) {
                grade = "E";
            } else if (nilai <= 40) {
                grade = "D";
            } else if (nilai <= 60) {
                grade = "C";
            } else if (nilai <= 80) {
                grade = "B";
            } else {
                grade = "A";
            }

            hasil.innerHTML = "Nilai: " + nilai + "<br>Grade: <b>" + grade + "</b>";
        }
    </script>
</body>
</html>
